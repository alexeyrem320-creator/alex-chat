
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Alex Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#172338;font-size:23px;font-weight:bold}
header span{color:#55aaff}
main{padding:15px;max-width:650px;margin:auto}
h2{font-size:21px}
.chat{background:#1c2b42;border-radius:13px;padding:15px;margin:10px 0}
.name{font-weight:bold;color:#65baff}
.message{color:#d5dfed;margin-top:7px}
#messages{height:55vh;overflow-y:auto;padding:10px 0}
.bubble{background:#243b58;padding:12px;border-radius:14px;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.mine{background:#1769aa;margin-left:auto}
form{display:flex;gap:8px;position:sticky;bottom:0;background:#101827;padding:10px 0}
input{min-width:0;flex:1;padding:14px;border:0;border-radius:12px;background:#24344c;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:12px 17px;background:#1685df;color:white;font-weight:bold}
.small{color:#9eacc0;font-size:13px}
</style>
</head>
<body>
<header><span>Alex</span> Chat</header>
<main>
<h2>Мои чаты</h2>
<div class="chat">
<div class="name">Команда Alex Chat</div>
<div class="message">Добро пожаловать в наш мессенджер!</div>
</div>
<div class="chat">
<div class="name">Избранное</div>
<div class="message">Личные заметки</div>
</div>
<h2>Переписка</h2>
<div id="messages">
<div class="bubble">Привет! Это твой первый чат в Alex Chat 👋</div>
</div>
<form id="form">
<input id="message" placeholder="Написать сообщение..." autocomplete="off">
<button type="submit">Отправить</button>
</form>
<p class="small">Первая тестовая версия Alex Chat. Сообщения пока сохраняются только в открытой странице.</p>
</main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const messages=document.getElementById('messages');
form.addEventListener('submit',function(e){
e.preventDefault();
const value=input.value.trim();
if(!value)return;
const bubble=document.createElement('div');
bubble.className='bubble mine';
bubble.textContent=value;
messages.appendChild(bubble);
input.value='';
messages.scrollTop=messages.scrollHeight;
});
</script>
</body>
</html>
